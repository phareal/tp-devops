name: CD — Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  AWS_REGION: eu-west-1
  ECR_BACKEND_REPO: ecommerce-backend
  ECR_FRONTEND_REPO: ecommerce-frontend
  ECS_CLUSTER: ecommerce-cluster
  ECS_SERVICE_BACKEND: ecommerce-backend-service
  ECS_SERVICE_FRONTEND: ecommerce-frontend-service
  TASK_DEF_BACKEND: ecommerce-backend-task
  TASK_DEF_FRONTEND: ecommerce-frontend-task

jobs:
  # ─────────────────────────────────────────────
  push-to-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker buildx build \
            --file infrastructure/docker/Dockerfile.backend \
            --tag $IMAGE \
            --push \
            --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_BACKEND_REPO:cache \
            --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_BACKEND_REPO:cache,mode=max \
            .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & push frontend
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ALB_URL: ${{ secrets.ALB_BACKEND_URL }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker buildx build \
            --file infrastructure/docker/Dockerfile.frontend \
            --build-arg VITE_API_URL=$ALB_URL \
            --tag $IMAGE \
            --push \
            --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_FRONTEND_REPO:cache \
            --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_FRONTEND_REPO:cache,mode=max \
            .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: push-to-ecr
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_DEF_BACKEND \
            --query taskDefinition \
            > task-def-backend.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-backend.json
          container-name: backend
          image: ${{ needs.push-to-ecr.outputs.backend-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to ECS
    runs-on: ubuntu-latest
    needs: [push-to-ecr, deploy-backend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FRONTEND \
            --query taskDefinition \
            > task-def-frontend.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-frontend.json
          container-name: frontend
          image: ${{ needs.push-to-ecr.outputs.frontend-image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ─────────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ] && \
             [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "✅ Deployment successful — SHA: ${{ github.sha }}"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
